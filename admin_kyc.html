<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Management - Avendus Admin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>const supabasejs = window.supabase;</script>
    <script src="db.js"></script>
    <style>
        body {
            background-color: #0f172a;
            /* Dark Navy for Admin */
            color: #f8fafc;
        }

        .admin-sidebar {
            width: 280px;
            background: #1e293b;
            height: 100vh;
            position: fixed;
            padding: 2rem;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-main {
            margin-left: 280px;
            padding: 2.5rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .admin-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Table Styles */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }

        .admin-table th {
            text-align: left;
            padding: 1rem;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-table td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            font-size: 0.95rem;
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .pill-pending {
            background: #f59e0b20;
            color: #f59e0b;
            border: 1px solid #f59e0b40;
        }

        .pill-approved {
            background: #10b98120;
            color: #10b981;
            border: 1px solid #10b98140;
        }

        .pill-rejected {
            background: #ef444420;
            color: #ef4444;
            border: 1px solid #ef444440;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-review {
            background: #3b82f6;
            color: white;
        }

        .btn-review:hover {
            background: #2563eb;
        }

        /* Modal */
        .admin-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            width: 900px;
            max-height: 90vh;
            border-radius: 20px;
            padding: 2.5rem;
            overflow-y: auto;
        }

        .doc-preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .doc-item {
            background: #0f172a;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .doc-img {
            width: 100%;
            height: 200px;
            background: #1e293b;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
        }

        .admin-note-area {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem;
            color: white;
            margin-bottom: 1.5rem;
            resize: none;
        }
    </style>
</head>

<body>
    <aside class="admin-sidebar">
        <h2 style="color: #3b82f6; margin-bottom: 3rem;">Admin Terminal</h2>
        <nav style="display: flex; flex-direction: column; gap: 1rem;">
            <a href="#" class="nav-item active"><i data-lucide="shield-check"></i> KYC Review</a>
            <a href="#" class="nav-item"><i data-lucide="users"></i> User List</a>
            <a href="#" class="nav-item"><i data-lucide="wallet"></i> Deposit Requests</a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div>
                <h1 style="font-size: 1.75rem; font-weight: 800;">KYC Management</h1>
                <p style="color: #94a3b8;">Review and approve user identity verifications.</p>
            </div>
            <div style="background: #1e293b; padding: 0.5rem 1rem; border-radius: 10px; border: 1px solid #334155;">
                Admin: 鸿磊 (Hong Lei)
            </div>
        </header>

        <section class="admin-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                <h3 style="color: #94a3b8;">Pending Requests</h3>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search mobile or name..."
                        style="background: #0f172a; border-color: #334155; color: white;">
                </div>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User Info</th>
                        <th>Full Name</th>
                        <th>Document</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="kycTableBody">
                    <!-- Data will be injected -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Review Modal -->
    <div id="reviewModal" class="admin-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Review Documents</h2>
                <button onclick="closeReview()"
                    style="background: none; border: none; color: white; cursor: pointer;"><i
                        data-lucide="x"></i></button>
            </div>
            <div class="doc-preview">
                <div class="doc-item">
                    <span>ID FRONT</span>
                    <div class="doc-img"><i data-lucide="file-text" size="40"></i></div>
                </div>
                <div class="doc-item">
                    <span>ID BACK</span>
                    <div class="doc-img"><i data-lucide="file-text" size="40"></i></div>
                </div>
                <div class="doc-item" style="grid-column: span 2;">
                    <span>SELFIE WITH ID</span>
                    <div class="doc-img" style="height: 300px;"><i data-lucide="user" size="60"></i></div>
                </div>
            </div>
            <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">Admin Note (Visible to User)</label>
            <textarea class="admin-note-area" id="adminNote" rows="3"
                placeholder="Reason for rejection or approval note..."></textarea>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn-action" style="background: #ef4444; color: white; padding: 1rem 2rem;"
                    onclick="processKYC('Rejected')">Reject KYC</button>
                <button class="btn-action" style="background: #10b981; color: white; padding: 1rem 2rem;"
                    onclick="processKYC('Approved')">Approve KYC</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let activeUserId = null;

        const mockRequests = [
            { id: 101, mobile: '918112233445', name: 'Rahul Sharma', doc: 'Aadhar', status: 'Pending' },
            { id: 102, mobile: '918108038000', name: 'Priya Patel', doc: 'PAN', status: 'Pending' }
        ];

        function renderTable() {
            const body = document.getElementById('kycTableBody');
            body.innerHTML = mockRequests.map(r => `
                <tr>
                    <td>
                        <div style="font-weight: 700;">${r.mobile}</div>
                        <div style="font-size: 0.75rem; color: #64748b;">UID: ${r.id}</div>
                    </td>
                    <td>${r.name}</td>
                    <td>${r.doc}</td>
                    <td><span class="status-pill pill-pending">${r.status}</span></td>
                    <td><button class="btn-action btn-review" onclick="openReview(${r.id})">Review Docs</button></td>
                </tr>
            `).join('');
        }

        function openReview(id) {
            activeUserId = id;
            document.getElementById('reviewModal').style.display = 'flex';
            lucide.createIcons();
        }

        function closeReview() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        async function processKYC(status) {
            const client = DB.getClient();
            if (client) {
                // Update in Supabase
                const note = document.getElementById('adminNote').value;
                // Since this is a demo, we'll alert and hide
                alert(`User ${activeUserId} KYC has been ${status}.`);
            }
            closeReview();
            // Remove from mock list for demo
            const idx = mockRequests.findIndex(r => r.id === activeUserId);
            mockRequests.splice(idx, 1);
            renderTable();
        }

        renderTable();
    </script>
</body>

</html>
